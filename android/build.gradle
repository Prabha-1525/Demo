// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// react-native-freshchat-sdk uses LocalBroadcastManager but does not declare the AndroidX
// artifact (split out from legacy support libraries). Add it to that module's classpath.
subprojects { subproject ->
    subproject.pluginManager.withPlugin("com.android.library") {
        if (subproject.name == "react-native-freshchat-sdk") {
            subproject.dependencies.add(
                "implementation",
                "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
            )
            // play-services-gcm:11.+ pulls com.android.support artifacts that clash with AndroidX at merge time.
            subproject.configurations.configureEach { config ->
                config.exclude group: "com.android.support"
            }
        }
    }
}
